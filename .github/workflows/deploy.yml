name: Publicar Rule the Realm

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    # Primero comprobar, compilar y subir los archivos.
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Descargar repositorio
              uses: actions/checkout@v6

            - name: Preparar Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar pruebas
              run: npm run test:run

            - name: Comprobar ESLint
              run: npm run lint

            - name: Compilar juego
              run: npm run build
              env:
                  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

            - name: Configurar GitHub Pages
              uses: actions/configure-pages@v6

            - name: Subir archivos compilados
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

    # Publicar solo después de finalizar el trabajo build.
    deploy:
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.deployment.outputs.page_url }}

        steps:
            # Primer intento de publicación.
            - name: Publicar - Primer intento
              id: first
              uses: actions/deploy-pages@v5
              continue-on-error: true

            # Si GitHub todavía no encuentra el artefacto,
            # esperar antes de volver a consultar.
            - name: Esperar antes del segundo intento
              if: steps.first.outcome == 'failure'
              run: sleep 15

            - name: Publicar - Segundo intento
              id: second
              if: steps.first.outcome == 'failure'
              uses: actions/deploy-pages@v5
              continue-on-error: true

            # Dar más margen a la sincronización de GitHub.
            - name: Esperar antes del tercer intento
              if: steps.second.outcome == 'failure'
              run: sleep 45

            # Último intento. Si también falla,
            # GitHub Actions indicará el error.
            - name: Publicar - Tercer intento
              id: deployment
              if: steps.second.outcome == 'failure'
              uses: actions/deploy-pages@v5
